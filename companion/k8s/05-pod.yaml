# Chapter 5 실습용. Book 03(companion/api)에서 빌드한 intro-api:1.0 Image를
# 그대로 사용한다 -- 새 Image를 만들지 않는다.
apiVersion: v1
kind: Pod
metadata:
  name: cloudshop-api
  labels:
    app: cloudshop-api
spec:
  containers:
    - name: api
      image: intro-api:1.0
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3000
