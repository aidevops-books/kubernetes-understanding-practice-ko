# Chapter 17 실습용. 개발 팀용 Namespace에 사용량 한도, 기본 자원 값, 읽기 전용 권한을 둔다.
apiVersion: v1
kind: Namespace
metadata:
  name: cloudshop-dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
  namespace: cloudshop-dev
spec:
  hard:
    pods: "6"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
---
# requests/limits를 적지 않은 Container에 기본값을 채운다.
apiVersion: v1
kind: LimitRange
metadata:
  name: dev-defaults
  namespace: cloudshop-dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 128Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-viewer
  namespace: cloudshop-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: cloudshop-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-viewer-reads-pods
  namespace: cloudshop-dev
subjects:
  - kind: ServiceAccount
    name: dev-viewer
    namespace: cloudshop-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
