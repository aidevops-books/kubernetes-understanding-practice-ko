# Chapter 18 실습용. Gateway API CRD와 Traefik Gateway provider가 설치되어 있어야 한다.
# Gateway: 요청을 받는 입구. Traefik의 web entryPoint(Container 포트 8000)에 연결된다.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cloudshop-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: Same
---
# HTTPRoute: 경로별로 어느 Service에 보낼지 정한다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloudshop-route
spec:
  parentRefs:
    - name: cloudshop-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: cloudshop-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cloudshop-web
          port: 80
