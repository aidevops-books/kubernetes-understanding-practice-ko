# Traefik Ingress provider; preserve API paths.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudshop-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloudshop-api
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: cloudshop-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudshop-web
                port:
                  number: 80
